<FONT FACE="verdana,arial,helvetica" SIZE=+1><B>Your Account</B></FONT><BR><BR>
<SCRIPT LANGUAGE="JavaScript">
var F = "<FONT FACE=\"verdana,arial,helvetica\" SIZE=-1>";
function hdr(t) { return "<TABLE BORDER=0 CELLPADDING=2 CELLSPACING=0 WIDTH=\"100%\"><TR><TD BGCOLOR=\"#CCCC99\"><FONT FACE=\"verdana,arial,helvetica\" SIZE=-1><B>&nbsp;" + t + "</B></FONT></TD></TR></TABLE>"; }
function orderStatus(o) {
  var mins = ((new Date()).getTime() - parseInt(o[1])) / 60000;
  if (mins < 90) return "Processing (you may still cancel)";
  if (mins < 60 * 24) return "Shipped -- on a truck somewhere in Nevada";
  return "Delivered. We hope you like it!";
}
function cancelOrder(no) {
  if (!confirm("Cancel order " + no + "? This cannot be undone.")) return false;
  var o = ordersGet(), out = new Array();
  for (var i = 0; i < o.length; i++) if (o[i][0] != no) out[out.length] = o[i];
  ordersSet(out);
  alert("Order " + no + " has been cancelled. Your card will not be charged.");
  location.href = P + "account.html";
  return false;
}
function toggle1Click() {
  if (oneClickOn()) { setCookie("orinoco_1click", "off", 365); alert("1-Click ordering is now OFF."); }
  else {
    if (!addrGet() || addrGet().length < 9) { alert("Before you can use 1-Click, please complete one order through the regular checkout so we have a shipping address and payment method on file."); return false; }
    setCookie("orinoco_1click", "on", 365); alert("1-Click ordering is now ON. Look for the Buy now with 1-Click button on any product page.");
  }
  location.href = P + "account.html";
  return false;
}
var u = userGet();
if (!u) {
  document.write(F + "Please <A HREF=\"" + P + "signin.html?next=account.html\"><B>sign in</B></A> to see your orders, change your 1-Click settings, and update your address book.<BR><BR>");
  document.write("New to Orinoco.com? Signing in takes about as long as a 28.8 modem takes to load this sentence.</FONT>");
} else {
  document.write(F + "Hello, <B>" + esc(u[0]) + "</B> (" + esc(u[1]) + "). <A HREF=\"" + P + "index.html\" onClick=\"return signOut()\">Sign out</A><BR><BR></FONT>");
  document.write(hdr("Your Orders"));
  var o = ordersGet();
  if (o.length == 0) document.write(F + "You have not placed any orders yet. No pressure.</FONT><BR>");
  for (var i = 0; i < o.length; i++) {
    var d = new Date(parseInt(o[i][1]));
    var st = orderStatus(o[i]);
    document.write(F + "<P><B>Order #" + o[i][0] + "</B>, placed " + longDate(d) + "<BR>");
    var its = o[i][2].split(",");
    for (var k = 0; k < its.length; k++) {
      var p = its[k].split(":"), it = findItem(p[0]);
      if (it) document.write("&nbsp;&nbsp;" + p[1] + " x <A HREF=\"" + itemURL(it) + "\">" + esc(it[1]) + "</A><BR>");
    }
    document.write("Total: <B>" + money(parseInt(o[i][4])) + "</B> &nbsp; Status: <FONT COLOR=\"#990000\">" + st + "</FONT>");
    if (st.indexOf("Processing") == 0) document.write(" &nbsp; <A HREF=\"#\" onClick=\"return cancelOrder('" + o[i][0] + "')\">Cancel this order</A>");
    document.write("</P></FONT>");
  }
  document.write("<BR>" + hdr("1-Click Settings"));
  var a = addrGet();
  if (a && a.length >= 9) {
    document.write(F + "<TABLE BORDER=0 CELLPADDING=3><TR><TD VALIGN=TOP>" + F + "<B>Ship to:</B><BR>" + esc(a[0]) + "<BR>" + esc(a[1]) + "<BR>" + esc(a[2]) + ", " + esc(a[3]) + " " + esc(a[4]) + "<BR>" + esc(a[5]) + "</FONT></TD>");
    document.write("<TD VALIGN=TOP>" + F + "<B>Pay with:</B><BR>" + esc(a[7]) + (a[8] != "" ? " ending in " + esc(a[8]) : "") + "<BR><B>Shipping:</B><BR>" + SHIP[parseInt(a[6])][0] + "</FONT></TD></TR></TABLE>");
    document.write("1-Click ordering is <B>" + (oneClickOn() ? "ON" : "OFF") + "</B>. <A HREF=\"#\" onClick=\"return toggle1Click()\">Turn 1-Click " + (oneClickOn() ? "off" : "on") + "</A></FONT><BR>");
  } else {
    document.write(F + "1-Click is not available yet. Complete one regular order and we will remember where to ship and how you like to pay.</FONT><BR>");
  }
  document.write("<BR>" + hdr("Your Wish List"));
  var w = wishGet();
  document.write(F + "There " + (w.length == 1 ? "is 1 item" : "are " + w.length + " items") + " on <A HREF=\"" + P + "wishlist.html\">your Wish List</A>.</FONT><BR>");
  document.write("<BR>" + hdr("Recommendations for " + esc(firstName())));
  // recommend bestsellers from the subjects you have bought or viewed
  var seen = getCookie("orinoco_seen"), subj = "";
  if (o.length) { var f1 = findItem(o[0][2].split(",")[0].split(":")[0]); if (f1) subj = f1[5]; }
  if (subj == "" && seen != "") { var f2 = findItem(seen.split(",")[0]); if (f2) subj = f2[5]; }
  var shown = 0;
  for (var j = 0; j < ITEMS.length && shown < 4; j++) {
    if ((subj == "" || ITEMS[j][5] == subj) && seen.indexOf(ITEMS[j][0]) == -1) {
      document.write("<TABLE BORDER=0 CELLPADDING=2><TR><TD><A HREF=\"" + itemURL(ITEMS[j]) + "\"><IMG SRC=\"" + coverURL(ITEMS[j]) + "\" BORDER=0></A></TD><TD>" + F + "<A HREF=\"" + itemURL(ITEMS[j]) + "\"><B>" + esc(ITEMS[j][1]) + "</B></A><BR>" + esc(ITEMS[j][2]) + "<BR>" + money(ITEMS[j][3]) + "</FONT></TD></TR></TABLE>");
      shown++;
    }
  }
}
</SCRIPT>
<NOSCRIPT>Your Account requires JavaScript.</NOSCRIPT>
