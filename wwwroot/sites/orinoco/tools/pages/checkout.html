<TABLE BORDER=0 CELLPADDING=0 CELLSPACING=0 WIDTH="100%"><TR>
<TD><FONT FACE="verdana,arial,helvetica" SIZE=+1><B>Checkout: Where should we ship?</B></FONT></TD>
<TD ALIGN=RIGHT><FONT FACE="verdana,arial,helvetica" SIZE=-2><B><FONT COLOR="#CC6600">1. ADDRESS</FONT></B> &gt; 2. SHIPPING &amp; PAYMENT &gt; 3. PLACE ORDER</FONT></TD></TR></TABLE><BR>
<SCRIPT LANGUAGE="JavaScript">
if (!userGet()) location.href = P + "signin.html?next=checkout.html";
else if (cartCount() == 0) location.href = P + "cart.html";
function clean(s) { return s.replace(/[|;~^]/g, " "); }
function saveAddr() {
  var f = document.forms["addr"];
  var v = new Array("fullname", "street", "city", "state", "zip");
  for (var i = 0; i < v.length; i++) {
    if (f.elements[v[i]].value.replace(/\s/g, "") == "") { alert("Please fill in every line of the address (" + v[i].replace("fullname", "name") + " is missing)."); f.elements[v[i]].focus(); return false; }
  }
  var a = addrGet();
  if (!a) a = new Array("", "", "", "", "", "", "0", "", "", "");
  a[0] = clean(f.fullname.value); a[1] = clean(f.street.value); a[2] = clean(f.city.value);
  a[3] = clean(f.state.value); a[4] = clean(f.zip.value); a[5] = f.country.options[f.country.selectedIndex].text;
  addrSet(a);
  location.href = P + "checkout2.html";
  return false;
}
var a = addrGet(), u = userGet();
function v(i, dflt) { return esc(a && a[i] ? a[i] : dflt); }
var F = "<FONT FACE=\"verdana,arial,helvetica\" SIZE=-1>";
document.write("<FORM NAME=\"addr\" onSubmit=\"return saveAddr()\"><TABLE BORDER=0 CELLPADDING=4 CELLSPACING=0 BGCOLOR=\"#EEEECC\">");
document.write("<TR><TD>" + F + "Full name:</FONT></TD><TD><INPUT TYPE=text NAME=\"fullname\" SIZE=32 VALUE=\"" + v(0, u ? u[0] : "") + "\"></TD></TR>");
document.write("<TR><TD>" + F + "Address:</FONT></TD><TD><INPUT TYPE=text NAME=\"street\" SIZE=40 VALUE=\"" + v(1, "") + "\"></TD></TR>");
document.write("<TR><TD>" + F + "City:</FONT></TD><TD><INPUT TYPE=text NAME=\"city\" SIZE=24 VALUE=\"" + v(2, "") + "\"></TD></TR>");
document.write("<TR><TD>" + F + "State/Province:</FONT></TD><TD><INPUT TYPE=text NAME=\"state\" SIZE=10 VALUE=\"" + v(3, "") + "\"> " + F + "ZIP/Postal code:</FONT> <INPUT TYPE=text NAME=\"zip\" SIZE=10 VALUE=\"" + v(4, "") + "\"></TD></TR>");
var countries = new Array("United States", "Canada", "United Kingdom", "Venezuela", "Australia", "Germany", "Japan", "Antarctica (research stations only)");
var co = "";
for (var i = 0; i < countries.length; i++) co += "<OPTION" + (a && a[5] == countries[i] ? " SELECTED" : "") + ">" + countries[i];
document.write("<TR><TD>" + F + "Country:</FONT></TD><TD><SELECT NAME=\"country\">" + co + "</SELECT></TD></TR>");
document.write("<TR><TD></TD><TD><INPUT TYPE=image SRC=\"" + P + "images/btn_continue.gif\" WIDTH=78 HEIGHT=19 BORDER=0 ALT=\"Continue\"></TD></TR>");
document.write("</TABLE></FORM>");
</SCRIPT>
<FONT FACE="verdana,arial,helvetica" SIZE=-2><IMG SRC="{P}images/lock.gif" WIDTH=20 HEIGHT=24 ALIGN=LEFT>You are shopping on our secure server.
Your address goes only into a cookie in your own browser, which is the most private place we could think of.</FONT><BR CLEAR=ALL>
