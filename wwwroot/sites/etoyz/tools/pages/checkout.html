<SCRIPT LANGUAGE="JavaScript">
// one page, three steps: ?step=ship (address + gift options), ?step=pay (shipping speed + card), ?step=review
var F = "<FONT FACE=\"Arial, Helvetica\" SIZE=2>";
var step = qs("step");
if (step == "") step = "ship";
var u = userGet(), c = cartGet();
// checkout profile cookie: name|street|city|state|zip|giftwrap|message|method|cardtype|last4
function prof() { var s = getCookie("etoyz_checkout"); return s == "" ? new Array("", "", "", "", "", "0", "", "0", "", "") : s.split("|"); }
function profSet(a) { setCookie("etoyz_checkout", a.join("|"), 30); }
function clean(s) { return s.replace(/[|;~]/g, " "); }
function luhn(num) {
  var sum = 0, alt = false;
  for (var i = num.length - 1; i >= 0; i--) { var d = parseInt(num.charAt(i)); if (alt) { d *= 2; if (d > 9) d -= 9; } sum += d; alt = !alt; }
  return sum % 10 == 0;
}
function steps(n) {
  var names = new Array("1. Ship to", "2. Shipping &amp; payment", "3. Review &amp; order"), h = "";
  for (var i = 0; i < 3; i++) h += (i ? " &gt; " : "") + (i == n ? "<FONT COLOR=\"#E21B1B\"><B>" + names[i] + "</B></FONT>" : names[i]);
  return "<FONT FACE=\"Arial, Helvetica\" SIZE=5 COLOR=\"#1B5FE2\"><B>Checkout</B></FONT> &nbsp; " + F + h + "</FONT><BR><BR>";
}
function saveShip() {
  var f = document.forms["ship"], a = prof();
  var need = new Array("fullname", "street", "city", "state", "zip");
  for (var i = 0; i < need.length; i++) if (f.elements[need[i]].value.replace(/\s/g, "") == "") { alert("Please fill in the whole address so Sprocket can find the house."); f.elements[need[i]].focus(); return false; }
  a[0] = clean(f.fullname.value); a[1] = clean(f.street.value); a[2] = clean(f.city.value); a[3] = clean(f.state.value); a[4] = clean(f.zip.value);
  a[5] = f.wrap.checked ? "1" : "0"; a[6] = clean(f.message.value).substring(0, 100);
  profSet(a);
  location.href = P + "checkout.html?step=pay";
  return false;
}
function savePay() {
  var f = document.forms["pay"], a = prof(), m = 0;
  for (var i = 0; i < f.method.length; i++) if (f.method[i].checked) m = i;
  var num = f.card.value.replace(/[^0-9]/g, "");
  if (num.length < 13 || num.length > 16 || !luhn(num)) { alert("That card number doesn't look right. (Psst: this is a pretend store. Use 4111 1111 1111 1111.)"); return false; }
  if (!inTimeForXmas(m) && !confirm("Heads up: with " + SHIP[m][0] + " this order will NOT arrive by Christmas. Continue anyway?")) return false;
  a[7] = "" + m; a[8] = f.cardtype.options[f.cardtype.selectedIndex].text; a[9] = num.substring(num.length - 4);
  profSet(a);
  location.href = P + "checkout.html?step=review";
  return false;
}
function placeOrder() {
  var a = prof(), n = cartCount(), sub = cartTotal(c), m = parseInt(a[7]);
  var total = sub + shipCost(m, n, sub) + (a[5] == "1" ? 395 * n : 0);
  var no = "ETZ-" + (100000 + Math.floor(Math.random() * 899999));
  var items = new Array();
  for (var i = 0; i < c.length; i++) items[items.length] = c[i][0] + ":" + c[i][1];
  var o = ordersGet();
  o.splice(0, 0, new Array(no, "" + (new Date()).getTime(), items.join(","), "" + m, "" + total, u[1]));
  ordersSet(o);
  cartSet(new Array());
  location.href = P + "thanks.html?order=" + no;
  return false;
}
if (!u) location.href = P + "signin.html?next=" + escape("checkout.html?step=" + step);
else if (c.length == 0) location.href = P + "cart.html";
else {
  var a = prof(), n = cartCount(), sub = cartTotal(c);
  if (a[0] == "") a[0] = u[0];
  if (step == "ship") {
    var h = steps(0) + "<FORM NAME=\"ship\" onSubmit=\"return saveShip()\"><TABLE BORDER=0 CELLPADDING=4 CELLSPACING=0 BGCOLOR=\"#FFFFED\">";
    h += "<TR><TD>" + F + "Name:</FONT></TD><TD><INPUT TYPE=text NAME=\"fullname\" SIZE=30 VALUE=\"" + esc(a[0]) + "\"></TD></TR>";
    h += "<TR><TD>" + F + "Street:</FONT></TD><TD><INPUT TYPE=text NAME=\"street\" SIZE=36 VALUE=\"" + esc(a[1]) + "\"></TD></TR>";
    h += "<TR><TD>" + F + "City:</FONT></TD><TD><INPUT TYPE=text NAME=\"city\" SIZE=20 VALUE=\"" + esc(a[2]) + "\"> " + F + "State:</FONT> <INPUT TYPE=text NAME=\"state\" SIZE=3 VALUE=\"" + esc(a[3]) + "\"> " + F + "ZIP:</FONT> <INPUT TYPE=text NAME=\"zip\" SIZE=6 VALUE=\"" + esc(a[4]) + "\"></TD></TR>";
    h += "<TR><TD VALIGN=TOP>" + F + "Gift options:</FONT></TD><TD>" + F + "<INPUT TYPE=checkbox NAME=\"wrap\"" + (a[5] == "1" ? " CHECKED" : "") + "> Gift-wrap everything in Sprocket's candy-stripe paper ($3.95 per toy)<BR>";
    h += "Gift message (100 characters):<BR><INPUT TYPE=text NAME=\"message\" SIZE=45 MAXLENGTH=100 VALUE=\"" + esc(a[6]) + "\"></FONT></TD></TR>";
    h += "<TR><TD></TD><TD><INPUT TYPE=image SRC=\"" + P + "images/btn_continue.gif\" WIDTH=82 HEIGHT=26 BORDER=0 ALT=\"Continue\"></TD></TR></TABLE></FORM>";
    document.write(h);
  } else if (step == "pay") {
    var h = steps(1) + "<FORM NAME=\"pay\" onSubmit=\"return savePay()\">" + F + "<B>How fast?</B></FONT><BR><TABLE BORDER=0 CELLPADDING=3>";
    for (var i = 0; i < SHIP.length; i++) {
      h += "<TR><TD><INPUT TYPE=radio NAME=\"method\"" + (parseInt(a[7]) == i ? " CHECKED" : "") + "></TD><TD>" + F + SHIP[i][0] + "</FONT></TD><TD ALIGN=RIGHT>" + F + "<B>" + (shipCost(i, n, sub) == 0 ? "FREE" : money(shipCost(i, n, sub))) + "</B></FONT></TD>";
      h += "<TD>" + F + (inTimeForXmas(i) ? "<FONT COLOR=\"#1BA84A\">arrives by Christmas!</FONT>" : "<FONT COLOR=\"#E21B1B\">too late for Christmas</FONT>") + "</FONT></TD></TR>";
    }
    h += "</TABLE><BR>" + F + "<B>Pay with:</B></FONT><BR><TABLE BORDER=0 CELLPADDING=3 BGCOLOR=\"#FFFFED\"><TR><TD>" + F + "Card:</FONT></TD><TD><SELECT NAME=\"cardtype\"><OPTION>Visa<OPTION>MasterCard<OPTION>American Express<OPTION>Discover</SELECT></TD></TR>";
    h += "<TR><TD>" + F + "Number:</FONT></TD><TD><INPUT TYPE=text NAME=\"card\" SIZE=22></TD></TR>";
    h += "<TR><TD>" + F + "Expires:</FONT></TD><TD><SELECT NAME=\"m\"><OPTION>01<OPTION>02<OPTION>03<OPTION>04<OPTION>05<OPTION>06<OPTION>07<OPTION>08<OPTION>09<OPTION>10<OPTION>11<OPTION>12</SELECT> <SELECT NAME=\"y\"><OPTION>1999<OPTION>2000<OPTION>2001<OPTION>2002<OPTION>2003</SELECT></TD></TR></TABLE>";
    h += F + "<FONT SIZE=1>A pretend store: we check the number, keep only the last four digits, and charge nothing. Test card 4111 1111 1111 1111.</FONT></FONT><BR><BR>";
    h += "<INPUT TYPE=image SRC=\"" + P + "images/btn_continue.gif\" WIDTH=82 HEIGHT=26 BORDER=0 ALT=\"Continue\"></FORM>";
    document.write(h);
  } else {
    if (a[9] == "") location.href = P + "checkout.html?step=pay";
    var m = parseInt(a[7]), ship = shipCost(m, n, sub), wrap = (a[5] == "1" ? 395 * n : 0);
    var h = steps(2) + "<TABLE BORDER=0 CELLPADDING=5 CELLSPACING=0 WIDTH=\"100%\"><TR><TD VALIGN=TOP BGCOLOR=\"#FFFFED\" WIDTH=\"50%\">" + F + "<B>Ship to</B> (<A HREF=\"" + P + "checkout.html?step=ship\">change</A>)<BR>" + esc(a[0]) + "<BR>" + esc(a[1]) + "<BR>" + esc(a[2]) + ", " + esc(a[3]) + " " + esc(a[4]);
    if (a[5] == "1") h += "<BR><BR><B>Gift-wrapped</B>" + (a[6] != "" ? ", with the message:<BR><I>" + esc(a[6]) + "</I>" : "");
    h += "</FONT></TD><TD VALIGN=TOP BGCOLOR=\"#FFFFED\">" + F + "<B>Shipping</B> (<A HREF=\"" + P + "checkout.html?step=pay\">change</A>)<BR>" + SHIP[m][0] + "<BR>" + (inTimeForXmas(m) ? "<FONT COLOR=\"#1BA84A\"><B>Arrives by Christmas!</B></FONT>" : "<FONT COLOR=\"#E21B1B\">Will arrive after Christmas</FONT>");
    h += "<BR><BR><B>Payment</B><BR>" + esc(a[8]) + " ending in " + esc(a[9]) + "</FONT></TD></TR></TABLE><BR><TABLE BORDER=0 CELLPADDING=3 CELLSPACING=0 WIDTH=\"100%\">";
    for (var i = 0; i < c.length; i++) { var t = findToy(c[i][0]); h += "<TR><TD>" + F + c[i][1] + " x " + esc(t[1]) + "</FONT></TD><TD ALIGN=RIGHT>" + F + money(t[6] * c[i][1]) + "</FONT></TD></TR>"; }
    h += "<TR><TD ALIGN=RIGHT>" + F + "Toys:</FONT></TD><TD ALIGN=RIGHT>" + F + money(sub) + "</FONT></TD></TR>";
    h += "<TR><TD ALIGN=RIGHT>" + F + "Shipping:</FONT></TD><TD ALIGN=RIGHT>" + F + (ship == 0 ? "FREE" : money(ship)) + "</FONT></TD></TR>";
    if (wrap) h += "<TR><TD ALIGN=RIGHT>" + F + "Gift wrap:</FONT></TD><TD ALIGN=RIGHT>" + F + money(wrap) + "</FONT></TD></TR>";
    h += "<TR><TD ALIGN=RIGHT>" + F + "<B>Total:</B></FONT></TD><TD ALIGN=RIGHT>" + F + "<FONT SIZE=3 COLOR=\"#E21B1B\"><B>" + money(sub + ship + wrap) + "</B></FONT></FONT></TD></TR></TABLE><BR>";
    h += "<FORM NAME=\"place\" onSubmit=\"return placeOrder()\"><CENTER><INPUT TYPE=image SRC=\"" + P + "images/btn_place.gif\" WIDTH=118 HEIGHT=26 BORDER=0 ALT=\"Place My Order\"></CENTER></FORM>";
    document.write(h);
  }
}
</SCRIPT>
